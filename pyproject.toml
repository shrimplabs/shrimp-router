[project]
name = "shrimp-router"
version = "0.2.0"
description = "Intelligent OpenAI-compatible gateway for LLM and VLM backends with quota tracking and task-type routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
shrimp-router = "shrimp_router.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shrimp_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
